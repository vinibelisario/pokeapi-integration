services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pokeapi
      POSTGRES_USER: pokeapi
      POSTGRES_PASSWORD: pokeapi
    ports:
      - "5433:5432"
    volumes:
      - pokeapi-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokeapi -d pokeapi"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: main/java
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/pokeapi
      DB_USERNAME: pokeapi
      DB_PASSWORD: pokeapi
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-of-32-bytes}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo12345}
    ports:
      - "8080:8080"

volumes:
  pokeapi-db: