spring:
  application:
    name: pokeapi-integration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

pokeapi:
  base-url: ${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}
  cache:
    ttl-minutes: ${POKEAPI_CACHE_TTL_MINUTES:10}
    max-size: ${POKEAPI_CACHE_MAX_SIZE:500}