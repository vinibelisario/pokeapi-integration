spring:
  application:
    name: pokeapi-integration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pokeapi}
    username: ${DB_USERNAME:pokeapi}
    password: ${DB_PASSWORD:pokeapi}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

pokeapi:
  base-url: ${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}
  cache:
    ttl-minutes: ${POKEAPI_CACHE_TTL_MINUTES:10}
    max-size: ${POKEAPI_CACHE_MAX_SIZE:500}
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-change-me-to-a-long-random-value-of-32-bytes}
      ttl: ${JWT_TTL:PT60M}